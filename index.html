<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Connect</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <h2>Mobile<span>Connect</span></h2>

        <div>
            <a href="#">Home</a>
            <a href="#">Apps</a>
            <a href="#">Games</a>
            <a href="#">Settings</a>
        </div>
    </nav>

    <div class="main">

        <div class="content">
            <h1>Use Your Mobile<br>On Your Laptop</h1>

            <p>
                Connect your Android mobile with USB
                and use your mobile screen on your laptop.
            </p>

            <button id="connect">Connect Mobile</button>

            <p id="status">● Mobile not connected</p>
        </div>

        <div class="phone">
            <div class="screen">

                <div id="welcome">
                    <div class="icon">📱</div>
                    <h2>Mobile Screen</h2>
                    <p>Connect your phone to begin</p>
                </div>

                <div id="apps" class="hidden">

                    <h3>Mobile Apps</h3>

                    <div class="app-grid">
                        <button>📱<br>Phone</button>
                        <button>💬<br>Messages</button>
                        <button>▶️<br>YouTube</button>
                        <button>🎮<br>Games</button>
                    </div>

                </div>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
